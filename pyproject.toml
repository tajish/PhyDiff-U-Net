[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "phydiff-unet-original"
version = "0.1.0"
description = "Original-notebook implementation of PhyDiff U-Net and its published experiments"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["torch>=2.0", "numpy", "scipy", "scikit-image", "matplotlib", "scikit-learn", "pandas", "ipython"]

[project.optional-dependencies]
notebooks = ["opencv-python", "torchvision", "pillow", "tqdm", "prettytable", "jupyterlab", "nbformat"]
test = ["pytest", "nbformat"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
